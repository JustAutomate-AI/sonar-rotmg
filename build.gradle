plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}
sourceCompatibility = 1.8
// the sources hold a few non-ASCII characters; without this the build depends on the machine's code page
compileJava.options.encoding = 'UTF-8'
targetCompatibility = 1.8

applicationName = 'Sonar'

// Two different things were both called "version", and the names invited exactly one
// mistake: reading the frozen asset key below as a stale app version. They are now
// named for what they are.

// The app's version. It lives in Updater.CURRENT because five scripts in tools/ read it
// from there, and the release routine raises it. Gradle's own project.version follows it
// so the build's metadata is not stale; nothing is stamped into the source from here.
project.version = {
    def src = file('src/main/java/sonar/ui/Updater.java')
    def m = src.getText('UTF-8') =~ /CURRENT\s*=\s*"([0-9.]+)"/
    if (!m) throw new GradleException("Could not read CURRENT from ${src}")
    m[0][1]
}()

// The asset-extraction cache key, which is NOT the app version. It forms part of the key
// deciding whether an install re-extracts the game's assets, so raising it makes every
// install re-extract once. Raise it only when the extracted format changes - adding a new
// kind of extracted asset counts, because checkUpdateAssets looks for ObjectID.list and
// TileID.list and will not otherwise notice that something new is missing.
// The value is historical: it is the app version from the days the two were one thing,
// and it is kept verbatim so that renaming them re-extracts nobody's assets.
ext.assetFormat = 'v1.9.2'

repositories {
    mavenCentral()
}

dependencies {
    // packet capture, formerly pulled in through the separate RealmShark jar
    implementation 'com.ardikars.pcap:pcap-spi:1.4.2'
    implementation 'com.ardikars.pcap:pcap-jdk7:1.4.2'
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation 'com.google.flatbuffers:flatbuffers-java:23.5.26'
    implementation 'com.github.weisj:darklaf-core:3.0.2'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}

mainClassName = applicationName.toLowerCase() + '.' + applicationName


jar {
    manifest {
        attributes(
                'Main-Class': mainClassName
        )
    }
}

// Ugly solution to get version into source.
task generateSources {
    doFirst {
        def srcFile = new File(file("$buildDir/../src/main/java/" + applicationName.toLowerCase() + "/version"), "Version.java")
        srcFile.parentFile.mkdirs()
        srcFile.write("""package """ + applicationName.toLowerCase() + """.version;
/**
 * Don't edit this class. Gradle writes it from build.gradle on every build.
 */
public class Version {

    /**
     * The app's version, the one shown in the left rail and used for release names.
     * Comes from Updater.CURRENT, which is where it is raised.
     */
    public static final String VERSION = "$project.version";

    /**
     * The asset-extraction format, which is NOT the app's version and does not move
     * with it. It forms part of the key deciding whether an install re-extracts the
     * game's assets, so raising it costs every install one re-extraction. Raise it
     * only when what gets extracted actually changes.
     */
    public static final String ASSET_FORMAT = "$project.ext.assetFormat";
}

""")
    }
}
// The changelog ships inside the jar, so the window that appears after an update has
// something to read without going to the network - and what it reads is always the file
// this build was cut from rather than whatever a release page says later.
processResources {
    from('CHANGELOG.md')
}

compileJava.dependsOn generateSources
compileJava.source generateSources.outputs.files, sourceSets.main.java

/**
 * add to vm optoins
 * "-XstartOnFirstThread"
 */
shadowJar {
    manifest {
        attributes 'Main-Class': mainClassName,
                'Implementation-Title': 'Sonar',
                'Implementation-Vendor': 'JustAutomate-AI'
    }
    archiveFileName = "${applicationName}.jar"
}

apply plugin: 'com.github.johnrengelman.shadow'
