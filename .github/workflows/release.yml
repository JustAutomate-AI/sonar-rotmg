# Builds a release where anyone can watch it happen.
#
# The point of this file is not convenience. Sonar reads network traffic, so the fair
# question from a stranger is "the source looks fine, but did the binary I downloaded
# come from it?" A release built on a laptop cannot answer that. This one can: the job
# runs in public, and attest-build-provenance signs a statement tying each file to this
# workflow and this commit. Anyone can check it before running anything:
#
#   gh attestation verify Sonar-<version>-setup.msi --repo JustAutomate-AI/sonar-rotmg
#
# The self-test is not run here. Its assertions read the game's own sprite sheets,
# which only exist on a machine with Realm of the Mad God installed, so it stays a gate
# that is passed locally before the tag is pushed.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the v'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's downloaded dependencies and wrapper, kept between runs. Without this
          # every release re-resolved and re-downloaded the lot from a cold runner, which
          # was the single largest step in the build.
          cache: gradle

      - name: Work out the version
        id: v
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { $tag -replace '^v', '' }
          # the tag and Updater.CURRENT must agree, or the app would offer an update to itself
          $source = Get-Content src/main/java/sonar/ui/Updater.java -Raw
          if ($source -notmatch 'CURRENT\s*=\s*"([^"]+)"') { throw "Could not read the version from Updater.java" }
          $declared = $Matches[1]
          if ($declared -ne $version) { throw "Tag says $version but Updater.CURRENT says $declared" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        # --build-cache reuses task outputs across runs alongside the dependency cache above;
        # the daemon is pointless on a runner that is thrown away after one build.
        run: ./gradlew.bat shadowJar --build-cache --no-daemon

      # jpackage needs WiX 3 to produce an MSI, and JDK 17 cannot use WiX 4 or later.
      # It is fetched here rather than taken from the runner image, which does not
      # reliably carry it, and the hash is checked so the build depends on one exact
      # artifact instead of whatever the URL happens to serve.
      # WiX is the same 30MB zip every single time, pinned by hash below, so it is kept
      # between runs rather than fetched from GitHub on each one.
      - name: Reuse WiX if we already have it
        id: wixcache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wix314
          key: wix-3.14.1-rtm

      - name: Fetch WiX 3.14
        if: steps.wixcache.outputs.cache-hit != 'true'
        id: wix
        shell: pwsh
        run: |
          $expected = '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31'
          $zip = "$env:RUNNER_TEMP\wix314.zip"
          $dir = "$env:RUNNER_TEMP\wix314"
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip -UseBasicParsing
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "WiX hash is $actual, expected $expected" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Package the zip, the installer and the checksums
        shell: pwsh
        run: ./tools/make-package.ps1 -Version ${{ steps.v.outputs.version }} -Wix "$env:RUNNER_TEMP\wix314"

      - name: Check both files were produced
        shell: pwsh
        run: |
          foreach ($f in @("dist/Sonar-${{ steps.v.outputs.version }}-windows.zip",
                           "dist/Sonar-${{ steps.v.outputs.version }}-setup.msi",
                           "dist/SHA256SUMS-${{ steps.v.outputs.version }}.txt")) {
            if (-not (Test-Path $f)) { throw "$f was not built" }
            "{0,-44} {1} MB" -f (Split-Path $f -Leaf), [Math]::Round((Get-Item $f).Length / 1MB, 1)
          }

      - name: Attest where these files came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Sonar-${{ steps.v.outputs.version }}-windows.zip
            dist/Sonar-${{ steps.v.outputs.version }}-setup.msi

      # Only for a run with no release to attach to. On a tag the same three files are
      # uploaded to the release a few lines down, and uploading them twice is pure waiting.
      - name: Keep the build for inspection
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: sonar-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Attach everything to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} `
            "dist/Sonar-${{ steps.v.outputs.version }}-windows.zip" `
            "dist/Sonar-${{ steps.v.outputs.version }}-setup.msi" `
            "dist/SHA256SUMS-${{ steps.v.outputs.version }}.txt" `
            --clobber
